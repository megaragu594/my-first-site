<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>次の一冊</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f7f5f0;
            color: #333;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e2dc;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            padding: 45px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin: 0 0 20px;
        }

        .hero p {
            color: #666;
            line-height: 1.8;
        }

        .start-button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 35px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .question {
            margin-top: 30px;
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .question h2 {
            text-align: center;
            margin-top: 0;
        }

        .choices {
            display: grid;
            gap: 12px;
            margin-top: 25px;
        }

        .choice {
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }

        .choice:hover {
            background: #f1eee8;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 32px;
            }

            main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="site-name">📚 次の一冊</div>
    </div>
</header>

<main>

    <section class="hero">

        <h1>次に読む本、見つけよう。</h1>

        <p>
            「何か本を読みたいけど、何を読めばいいか分からない」<br>
            そんなときのための、本探しのお手伝いサイトです。
        </p>

        <a href="#question" class="start-button">
            本を探してみる
        </a>

    </section>


    <section class="question" id="question">

        <h2>Q1. 今日はどんな気分？</h2>

        <div class="choices">

            <button class="choice">
                🌿 ゆったり読みたい
            </button>

            <button class="choice">
                😂 楽しく笑いたい
            </button>

            <button class="choice">
                😮 ハラハラしたい
            </button>

            <button class="choice">
                🧙 異世界ものが読みたい
            </button>

            <button class="choice">
                🧠 何かを学びたい
            </button>

        </div>

    </section>

</main>

<footer>
    © 2026 次の一冊
</footer>

</body>
</html>
