<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>次の一冊</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f7f5f0;
            color: #333;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e2dc;
            padding: 18px 20px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .page {
            background: white;
            padding: 45px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .page h1 {
            font-size: 36px;
            margin: 0 0 20px;
        }

        .page p {
            color: #666;
            line-height: 1.8;
        }

        .button {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 15px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            color: #333;
            font-size: 17px;
            cursor: pointer;
            text-align: center;
        }

        .button:hover {
            background: #f1eee8;
        }

        .main-button {
            background: #333;
            color: white;
            border: none;
            margin-top: 30px;
        }

        .main-button:hover {
            background: #444;
        }

        .hidden {
            display: none;
        }

        .question {
            text-align: center;
        }

        .question h2 {
            margin-bottom: 25px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .page h1 {
                font-size: 30px;
            }

            main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="site-name">📚 次の一冊</div>
    </div>
</header>

<main>

    <!-- トップページ -->
    <section class="page" id="home">

        <h1>次に読む本、見つけよう。</h1>

        <p>
            「何か本を読みたいけど、何を読めばいいか分からない」<br>
            そんなときのための、本探しのお手伝いサイトです。
        </p>

        <button class="button main-button" onclick="showPage('choice')">
            本を探してみる
        </button>

    </section>


    <!-- 探し方を選ぶ画面 -->
    <section class="page hidden" id="choice">

        <h1>どうやって探しますか？</h1>

        <p>
            あなたに合った方法で、本を探してみましょう。
        </p>

        <button class="button" onclick="showPage('mood')">
            🎭 気分から探す
        </button>

        <button class="button" onclick="showPage('search')">
            🔍 自分で探す
        </button>

    </section>


    <!-- Q1 -->
    <section class="page hidden question" id="mood">

        <h1>気分から探す</h1>

        <h2>Q1. 今日はどんな気分？</h2>

        <button class="button">
            🌿 ゆったり読みたい
        </button>

        <button class="button">
            😂 楽しく笑いたい
        </button>

        <button class="button">
            😮 ハラハラしたい
        </button>

        <button class="button">
            🧙 異世界ものが読みたい
        </button>

        <button class="button">
            🧠 何かを学びたい
        </button>

    </section>


    <!-- 自分で探す画面 -->
    <section class="page hidden" id="search">

        <h1>自分で探す</h1>

        <p>
            ここには後ほど、本のタイトルやジャンルなどから<br>
            自分で探せる検索機能を追加します。
        </p>

    </section>

</main>

<footer>
    © 2026 次の一冊
</footer>


<script>
    function showPage(pageId) {

        const pages = document.querySelectorAll(".page");

        pages.forEach(function(page) {
            page.classList.add("hidden");
        });

        document.getElementById(pageId).classList.remove("hidden");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
</script>

</body>
</html>
